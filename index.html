<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThingsYouShouldKnow</title>
    <style>
        /* Modern Reset and Fonts */
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff; 
            margin: 0; 
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #000;
        }

        h1 { 
            font-size: 3rem; 
            font-weight: 800; 
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        /* Neal.fun Inspired Search Bar */
        .search-container {
            position: sticky;
            top: 20px;
            z-index: 100;
            width: 100%;
            max-width: 600px;
            margin-bottom: 50px;
        }

        #searchBar { 
            width: 100%; 
            padding: 15px 25px; 
            font-size: 18px; 
            border: 3px solid #000; 
            border-radius: 50px; 
            background: #fff;
            box-shadow: 0 4px 0 #000;
            outline: none;
            transition: all 0.1s ease;
        }

        #searchBar:focus {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #000;
        }

        /* The Grid Layout */
        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            width: 100%; 
            max-width: 1100px; 
        }

        /* Neal.fun Card Style */
        .item-card { 
            background: #f3f3f3; 
            padding: 30px 20px; 
            border-radius: 20px; 
            text-align: center; 
            text-decoration: none; 
            color: #000;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid transparent;
        }

        /* The "Bounce" Effect on Hover */
        .item-card:hover { 
            transform: scale(1.05);
            background: #fff;
            border-color: #000;
            box-shadow: 0 10px 0 rgba(0,0,0,0.05);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 0 rgba(0,0,0,0.1));
        }

        .item-card h2 { 
            margin: 0; 
            font-size: 1.5rem; 
            font-weight: 700;
        }

        .item-card p { 
            color: #555; 
            font-size: 1rem; 
            margin-top: 10px;
            line-height: 1.4;
        }

        .hidden { display: none; }

        /* Small screen adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>ThingsYouShouldKnow</h1>
    
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search the collection..." onkeyup="searchFunction()">
    </div>

    <div class="container" id="contentGrid">
        
        <!-- CARD 1 -->
        <a href="#" class="item-card">
            <div class="icon">🛰️</div>
            <h2>Infrastructure</h2>
            <p>Exploring the backbone of the digital world.</p>
        </a>

        <!-- CARD 2 -->
        <a href="#" class="item-card">
            <div class="icon">☁️</div>
            <h2>Cloud Services</h2>
            <p>Scaling ideas into the atmosphere.</p>
        </a>

        <!-- CARD 3 -->
        <a href="#" class="item-card">
            <div class="icon">🚜</div>
            <h2>Land Records</h2>
            <p>Managing the roots and the soil.</p>
        </a>

        <!-- Add more cards here! -->

    </div>

    <script>
        function searchFunction() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let cards = document.getElementsByClassName('item-card');
            
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h2')[0].innerText.toLowerCase();
                let desc = cards[i].getElementsByTagName('p')[0].innerText.toLowerCase();
                
                if (title.includes(input) || desc.includes(input)) {
                    cards[i].classList.remove('hidden');
                } else {
                    cards[i].classList.add('hidden');
                }
            }
        }
    </script>
</body>
</html>
